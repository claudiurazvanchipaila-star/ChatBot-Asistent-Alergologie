<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Asistent clinic în alergologie</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef3f8;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #0f5f87;
            margin-top: 0;
        }

        h2, h3, h4 {
            color: #183447;
            margin-bottom: 8px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 12px;
            margin-bottom: 5px;
            color: #183447;
        }

        textarea, input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 12px;
            border: 1px solid #c9d6e2;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        button {
            background: #0f5f87;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            font-weight: bold;
            margin-top: 10px;
        }

        button:hover {
            background: #0b4c6d;
        }

        pre {
            background: #f4f6f8;
            padding: 15px;
            white-space: pre-wrap;
            border-radius: 8px;
            border: 1px solid #dde7ef;
            overflow-x: auto;
        }

        .warning {
            color: #b4232f;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .hint {
            font-size: 12px;
            color: #5f7383;
            margin-top: -6px;
            margin-bottom: 10px;
        }

        .section {
            margin-top: 18px;
            padding: 14px;
            background: #f8fbfd;
            border: 1px solid #dde7ef;
            border-radius: 8px;
        }

        .hidden {
            display: none;
        }

        ul {
            margin-top: 8px;
            padding-left: 20px;
        }

        li {
            margin-bottom: 6px;
        }

        .source-box {
            background: #ffffff;
            border: 1px solid #dbe5ee;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .source-title {
            font-weight: bold;
            color: #0f5f87;
            margin-bottom: 6px;
        }

        .muted {
            color: #5f7383;
            font-size: 13px;
        }

        .small-warning {
            background: #fff4d6;
            border: 1px solid #f2d58a;
            color: #7a5a00;
            padding: 10px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Asistent clinic în alergologie</h1>

    <p class="warning">
        Instrument de suport pentru medic. Nu înlocuiește decizia clinică.
    </p>

    <label>Simptome</label>
    <textarea id="symptoms" placeholder="Ex: strănut, rinoree, prurit nazal, wheezing"></textarea>

    <label>Vârstă</label>
    <input id="age" placeholder="Ex: 24">

    <label>Greutate (kg)</label>
    <input id="weight" placeholder="Ex: 18">

    <label>Sex</label>
    <input id="sex" placeholder="Ex: F / M">

    <label>Antecedente personale patologice</label>
    <textarea id="personal_history" placeholder="Opțional: ex. astm, dermatită atopică, rinită alergică, anafilaxie anterioară, polipoză nazală"></textarea>
    <div class="hint">Câmp opțional.</div>

    <label>Antecedente heredocolaterale</label>
    <textarea id="family_history" placeholder="Opțional: ex. mamă cu astm, tată cu rinită alergică, istoric familial de atopie"></textarea>
    <div class="hint">Câmp opțional.</div>

    <button onclick="trimite()">Analizează cazul</button>

    <div class="section">
        <h3>Răspuns clinic</h3>
        <pre id="response">Aici va apărea analiza clinică.</pre>
    </div>

    <div id="differentialSection" class="section hidden">
        <h3>Diagnostic diferențial</h3>
        <ul id="differentialList"></ul>
    </div>

    <div id="sourcesSection" class="section hidden">
        <h3>Fragmente relevante din surse</h3>
        <div id="sourcesList"></div>
    </div>

    <div id="warningSection" class="small-warning hidden"></div>

</div>

<script>
function escapeHtml(text) {
    if (text === null || text === undefined) return "";
    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}

function safeValue(value, fallback = "-") {
    if (value === null || value === undefined) return fallback;
    const cleaned = String(value).trim();
    return cleaned ? cleaned : fallback;
}

function formatDifferentialItem(item) {
    if (typeof item === "string") {
        return item;
    }

    if (typeof item === "object" && item !== null) {
        const name =
            item.name ||
            item.diagnosis ||
            item.label ||
            item.title ||
            "Diagnostic posibil";

        const score =
            item.score ??
            item.probability ??
            item.confidence ??
            item.match_score;

        if (score !== null && score !== undefined && String(score).trim() !== "") {
            return `${name} (scor: ${score})`;
        }

        return name;
    }

    return String(item);
}

function formatSourceItem(item) {
    if (typeof item === "string") {
        return `
            <div class="source-box">
                <div>${escapeHtml(item)}</div>
            </div>
        `;
    }

    if (typeof item === "object" && item !== null) {
        const title =
            item.source ||
            item.title ||
            item.file ||
            item.document ||
            "Sursă clinică";

        const snippet =
            item.text ||
            item.content ||
            item.snippet ||
            item.chunk ||
            item.fragment ||
            "Fragment indisponibil.";

        const score =
            item.score ??
            item.similarity ??
            item.relevance;

        return `
            <div class="source-box">
                <div class="source-title">${escapeHtml(title)}</div>
                ${score !== null && score !== undefined ? `<div class="muted">Scor relevanță: ${escapeHtml(score)}</div>` : ""}
                <div style="margin-top: 8px;">${escapeHtml(snippet)}</div>
            </div>
        `;
    }

    return `
        <div class="source-box">
            <div>${escapeHtml(String(item))}</div>
        </div>
    `;
}

function trimite() {
    const responseBox = document.getElementById("response");
    const differentialSection = document.getElementById("differentialSection");
    const differentialList = document.getElementById("differentialList");
    const sourcesSection = document.getElementById("sourcesSection");
    const sourcesList = document.getElementById("sourcesList");
    const warningSection = document.getElementById("warningSection");

    responseBox.innerText = "Se procesează...";
    differentialList.innerHTML = "";
    sourcesList.innerHTML = "";
    differentialSection.classList.add("hidden");
    sourcesSection.classList.add("hidden");
    warningSection.classList.add("hidden");
    warningSection.innerText = "";

    fetch("/ask", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            symptoms: document.getElementById("symptoms").value,
            age: document.getElementById("age").value,
            weight: document.getElementById("weight").value,
            sex: document.getElementById("sex").value,
            personal_history: document.getElementById("personal_history").value,
            family_history: document.getElementById("family_history").value
        })
    })
    .then(async (res) => {
        const data = await res.json();
        if (!res.ok) {
            throw new Error(data.error || "A apărut o eroare la analiză.");
        }
        return data;
    })
    .then(data => {
        const clinicalOutput = safeValue(data.clinical_output, "Nu a fost generată analiza clinică.");
        responseBox.innerText = clinicalOutput;

        if (Array.isArray(data.differential) && data.differential.length > 0) {
            differentialSection.classList.remove("hidden");

            data.differential.forEach(item => {
                const li = document.createElement("li");
                li.textContent = formatDifferentialItem(item);
                differentialList.appendChild(li);
            });
        }

        if (Array.isArray(data.results) && data.results.length > 0) {
            sourcesSection.classList.remove("hidden");

            data.results.forEach(item => {
                sourcesList.innerHTML += formatSourceItem(item);
            });
        }

        if (data.warning) {
            warningSection.classList.remove("hidden");
            warningSection.innerText = data.warning;
        }
    })
    .catch(err => {
        responseBox.innerText = "Eroare: " + err.message;
    });
}
</script>

</body>
</html>
