<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Asistent clinic în alergologie</title>

    <style>
        body {
            font-family: Arial;
            background: #eef3f8;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            color: #0f5f87;
        }

        textarea, input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        button {
            background: #0f5f87;
            color: white;
            padding: 12px;
            border: none;
            cursor: pointer;
            width: 100%;
        }

        pre {
            background: #f4f6f8;
            padding: 15px;
            white-space: pre-wrap;
        }

        .warning {
            color: #b4232f;
            font-size: 13px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Asistent clinic în alergologie</h1>

    <p class="warning">
        Instrument de suport pentru medic. Nu înlocuiește decizia clinică.
    </p>

    <label>Simptome</label>
    <textarea id="symptoms" placeholder="Ex: strănut, rinoree, prurit nazal, wheezing"></textarea>

    <label>Vârstă</label>
    <input id="age" placeholder="Ex: 24">

    <label>Sex</label>
    <input id="sex" placeholder="Ex: F / M">

    <button onclick="trimite()">Analizează cazul</button>

    <h3>Răspuns:</h3>
    <pre id="response"></pre>

</div>

<script>
function trimite() {

    document.getElementById("response").innerText = "Se procesează...";

    fetch("/ask", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            symptoms: document.getElementById("symptoms").value,
            age: document.getElementById("age").value,
            sex: document.getElementById("sex").value
        })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("response").innerText = data.response;
    })
    .catch(err => {
        document.getElementById("response").innerText = "Eroare: " + err;
    });
}
</script>

</body>
</html>
