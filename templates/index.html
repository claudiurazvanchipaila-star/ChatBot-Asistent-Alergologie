<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Asistent clinic în alergologie</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef3f8;
            padding: 30px;
        }

        .container {
            max-width: 760px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #0f5f87;
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 12px;
            margin-bottom: 5px;
            color: #183447;
        }

        textarea, input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 12px;
            border: 1px solid #c9d6e2;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        button {
            background: #0f5f87;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            font-weight: bold;
            margin-top: 10px;
        }

        button:hover {
            background: #0b4c6d;
        }

        pre {
            background: #f4f6f8;
            padding: 15px;
            white-space: pre-wrap;
            border-radius: 8px;
            border: 1px solid #dde7ef;
        }

        .warning {
            color: #b4232f;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .hint {
            font-size: 12px;
            color: #5f7383;
            margin-top: -6px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Asistent clinic în alergologie</h1>

    <p class="warning">
        Instrument de suport pentru medic. Nu înlocuiește decizia clinică.
    </p>

    <label>Simptome</label>
    <textarea id="symptoms" placeholder="Ex: strănut, rinoree, prurit nazal, wheezing"></textarea>

    <label>Vârstă</label>
    <input id="age" placeholder="Ex: 24">

    <label>Greutate (kg)</label>
    <input id="weight" placeholder="Ex: 18">

    <label>Sex</label>
    <input id="sex" placeholder="Ex: F / M">

    <label>Antecedente personale patologice</label>
    <textarea id="personal_history" placeholder="Opțional: ex. astm, dermatită atopică, rinită alergică, anafilaxie anterioară, polipoză nazală"></textarea>
    <div class="hint">Câmp opțional.</div>

    <label>Antecedente heredocolaterale</label>
    <textarea id="family_history" placeholder="Opțional: ex. mamă cu astm, tată cu rinită alergică, istoric familial de atopie"></textarea>
    <div class="hint">Câmp opțional.</div>

    <button onclick="trimite()">Analizează cazul</button>

    <h3>Răspuns:</h3>
    <pre id="response"></pre>

</div>

<script>
function trimite() {
    document.getElementById("response").innerText = "Se procesează...";

    fetch("/ask", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            symptoms: document.getElementById("symptoms").value,
            age: document.getElementById("age").value,
            weight: document.getElementById("weight").value,
            sex: document.getElementById("sex").value,
            personal_history: document.getElementById("personal_history").value,
            family_history: document.getElementById("family_history").value
        })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("response").innerText = data.response;
    })
    .catch(err => {
        document.getElementById("response").innerText = "Eroare: " + err;
    });
}
</script>

</body>
</html>
